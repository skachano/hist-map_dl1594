# Holders of feudal realms, where the book says who holds them. Keys are curated territory ids.
realm_holders:
  fief-keltern-ostern: [house-eberstein, house-oberstein]   # "tenuz en fied de Son Altesse par les sieurs comtes d'Eberstein et Oberstein" (p. 89)
  county-vaudemont: duchy-lorraine          # "Bailliage du comté de Vaudémont", with its Domaine (p. 95)
  county-blamont: duchy-lorraine            # with its Domaine (p. 105)
  lordship-deneuvre: duchy-lorraine         # with its Domaine (p. 107)
  lordship-bitche: duchy-lorraine           # with its Domaine (p. 109); reunited to the domain (p. 136)
  lordship-phalsbourg: duchy-lorraine       # bought by Charles III (introduction, p. V)
  lordship-hombourg-et-saint-avold: duchy-lorraine   # bought by Charles III (introduction, p. V)

# Names for entries whose text is a description rather than a name.
entry_names:
  2176: Lothringen      # "Sur la montagne … les ruines d'un chasteau … appelle Lothringen" (p. 111)
  2177: Altheim         # "Elle consiste en ce seul village d'Altheim" (p. 111)

# Index lines for entries whose numbers led to the wrong line (checked by name and district).
entry_index:
  1003: Chaumouzcy      # "Chamoysy", old form of Chaumousey; the index prints 1005
  1672: Berus           # "La ville de Beaurains, Berriss": the index prints "Saarlouis (Pr.) 1672" without its comma
  1836: Lebcuville      # "Lebeufville" (Lebeuville), not Herbeuville
  1891: Saulx-en-Voévre # "Sault" in the bailliage of Hattonchâtel, not Le Sautel
  2244: Guemviller      # "Gunweiller" (Guenviller), not Buweiler
  2259: Ponlpierre      # "Steinbiderstorff": Steinbiedersdorf, Pontpierre's German name (no line prints 2259)

# Places for entries the index doesn't identify (a new place with the entry's name).
entry_places:
  1411: nittel          # "Nittel" (office of Siersberg); the index has no line for it

