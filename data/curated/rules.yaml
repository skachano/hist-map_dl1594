  2176: Lothringen      # "Sur la montagne … les ruines d'un chasteau … appelle Lothringen" (p. 111)
  2177: Altheim         # "Elle consiste en ce seul village d'Altheim" (p. 111)

# Index lines for entries whose numbers led to the wrong line (checked by name and district).
entry_index:
  1003: Chaumouzcy      # "Chamoysy", old form of Chaumousey; the index prints 1005
  1672: Berus           # "La ville de Beaurains, Berriss": the index prints "Saarlouis (Pr.) 1672" without its comma
  1836: Lebcuville      # "Lebeufville" (Lebeuville), not Herbeuville
  1891: Saulx-en-Voévre # "Sault" in the bailliage of Hattonchâtel, not Le Sautel
  2244: Guemviller      # "Gunweiller" (Guenviller), not Buweiler
  2259: Ponlpierre      # "Steinbiderstorff": Steinbiedersdorf, Pontpierre's German name (no line prints 2259)

# Index lines the scan misread or merged, as printed ("page|name as read": the printed line, or a
# list of lines when the scan ran two together).
index_lines:
  # The scan ran this line into the next, "[Bliesr]ansbach, vil., com. de Bischmisheim … 1578", which
  # the editor's corrections delete: 1578 is Heckenransbach ("au lieu de Bliesransbach").
  "191|Rlicsguei'sehwiller": "Bliesguerschwiller, canton de Sarreguemines, 1580."
  # The page's footnote ("1. Ban de Vezin-en-Vaul…") was read into the line, and its number lost.
  "188|Beaumont": "Beaumont, canton de Domèvre (Meurthe), 2037."
  # Two lines run together; Hœlling's number was lost.
  "218|Hoeliing":
    - "Hœlling, ham., com. de Bettwiller, 2166."
    - "Hoéville, canton de Lunéville-Nord, 483."
  # The footnote mark broke the name.
  "219|Immweiler1. «cetion du vil. d'Oherthu!": "Immweiler, section du vil. d'Oberthal, com. d'Alsweiler, 1508."
  # Two lines run together, the first letters of both lost in print: Velle (between Velaine-en-Haye and
  # Velle-sur-Moselle). The scan reads 1765, which is Houdelmont: Velle is entry 1763 ("Vclle").
  "256|V le":
    - "Velle, l'un des ham. formant la com. de Laloeuf, canton de Vézelise, 1763."
    - "Velle-sur-Moselle, canton de Bayon, 202."

# The index's spellings of an entry that no surviving index line carries ({entry: [spelling, …]}).
index_spellings:
  1491: [Sanbach, Saubach]   # the index's line, which the editor's corrections replace by Nieder-Saubach, and its footnote

# Places for entries the index doesn't identify (a new place with the entry's name).
